{% extends 'base.html' %}
{% block links %}
<link rel="stylesheet" href="{{ url_for('static', path='css/mapa.css') }}">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
{% endblock %}

{% block content %}

<body>

{% include 'navbar.html' %}

<form method="post" action="/owner-register">

    <div class="container-fluid min-vh-100 d-flex-column justify-content-center align-items-center">

        <div class="bg-primary border border-primary rounded-3 p-2 m-5 w-50 mx-auto">
                <h1 class="display-1 text-center text-light">Registro dueño compañia</h1>
        </div>

        <div class="d-flex flex-column justify-content-center
            align-items-center col-12 col-md-8
            col-lg-6 mx-auto bg-dark
            border rounded-3 p-3 border-dark mt-4">

            <div class="mb-4 w-100">
            <label class="form-label text-light">nombre</label>
            <input name="name" class="form-control flex-grow-1" placeholder="escribe tu nombre" required>
            </div>

            <div class="mb-4 w-100">
                <label class="form-label text-light">email</label>
                <input type="email" name="email" class="form-control flex-grow-1" placeholder="example@gmail.com" required>
            </div>

            <label for="inputPassword5" class="form-label text-light">contraseña</label>
            <input name="password" type="password" id="inputPassword5" class="form-control" aria-describedby="passwordHelpBlock">
            <div id="passwordHelpBlock" class="form-text text-light">
                Your password must be 5-20 characters long, contain letters and numbers, and must not contain spaces, special characters, or emoji.
            </div>

        </div>

        <div class="text-center">
            <button type="submit" class="btn btn-primary m-4 btn-lg">
                registrarse
            </button>
        </div>

    </div>

</form>

</body>
</html>

{% endblock %}
