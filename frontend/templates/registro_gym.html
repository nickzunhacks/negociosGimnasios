{% extends 'base.html' %}

{% block content %}

<body>
    {% include 'navbar.html' %}

    <form method="post" enctype="multipart/form-data" action="/location-register" >

        <div class="container-fluid min-vh-100 d-flex-column justify-content-center align-items-center">

            <div class="bg-primary border border-primary rounded-3 p-2 m-5 w-50 mx-auto">
                <h1 class="display-1 text-center text-light">Registro de gimnasio</h1>
            </div>

            <div class="d-flex flex-column justify-content-center
            align-items-center col-12 col-md-8
            col-lg-6 mx-auto bg-dark
            border rounded-3 p-3 border-dark">

                <input type="hidden" name="id_company" value="{{ id_company }}" >

                <div class="mb-4 w-100">
                    <label class="form-label text-light">nombre gimnasio</label>
                    <input name="name" class="form-control flex-grow-1" placeholder="nombre de tu gimnasio" required>
                </div>

                <div class="mb-4 w-100">
                    <label class="form-label text-light">descripcion</label>
                    <textarea name="description" class="form-control" rows="3" required></textarea>
                    <div class="form-text text-light">
                        tu descripcion no debe tener mas de 500 caracteres
                    </div>
                </div>

                <div class="mb-4 w-100">
                    <label class="form-label text-light">direccion</label>
                    <input name="address" class="form-control flex-grow-1" placeholder="direccion de tu gimnasio" required>
                    <div class="form-text text-light">
                        asegurate de que tu direccion contenga caracteres adecuados
                    </div>
                </div>

                <div class="mb-4 w-100">

                    <div class="mb-5 w-100">
                        <label class="form-label text-light">categoria de gimnasio</label>
                        <select name="type" class="form-select flex-grow-1" aria-label="Default select example">
                            <option value="Traditional">Tradicional</option>
                            <option value="Boxing">Boxing</option>
                            <option value="Crossfit">Crossfit</option>
                            <option value="Martial Arts">Martial Arts</option>
                            <option value="Climbing">Climbing</option>
                            <option value="Aquatic">Aquatic</option>
                            <option value="Yoga">Yoga</option>
                            <option value="Dance">Dance</option>
                            <option value="Boutique">Boutique</option>

                        </select>
                </div>

                    <div class="d-flex gap-4">

                        <div class="d-flex align-items-center gap-2">
                            <input name="pool" class="form-check-input" type="checkbox" value="" id="piscina">
                            <label class="form-check-label text-light" for="piscina">piscina</label>
                            <input name="pool_number" id="cantidadPiscina" type="number" class="form-control flex-grow-1" placeholder="numero piscinas" disabled>
                        </div>

                        <div class="d-flex align-items-center gap-2">
                            <input name="boxing_ring" class="form-check-input" type="checkbox" value="" id="ringbox">
                            <label class="form-check-label text-light" for="ringbox">ringbox</label>
                            <input name="boxing_ring_number" value="" id="numRingBox" type="number" class="form-control flex-grow-1" placeholder="numero rings" disabled>
                        </div>

                    </div>

                </div>

                <div class="mb-3">
                    <label for="imagen" class="form-label text-light">Selecciona una imagen</label>
                    <input
                        class="form-control"
                        name="img"
                        type="file"
                        id="imagen"
                        accept="image/*"
                        required
                    >
                </div>

            </div>

            <div class="text-center">
                <button type="submit" class="btn btn-primary m-4 btn-lg">
                    registrar
                </button>
            </div>

        </div>





    </form>

<script src="{{ url_for('static', path='checkbox.js') }}"></script>

</body>
</html>
{% endblock %}
